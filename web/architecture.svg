<svg viewBox="0 0 960 660" width="960" height="660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sniper-arch-title sniper-arch-desc">
<title id="sniper-arch-title">How Sniper fits together</title>
<desc id="sniper-arch-desc">Client traffic reaches Sniper's MITM proxy and is forwarded unchanged to the upstream target. The proxy hands a copy down to the interception engine, which persists sessions to disk and exposes them over a loopback-only HTTP API. That API drives the desktop UI and sniper-cli, and an AI agent drives Sniper through the CLI.</desc>

