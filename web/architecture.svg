<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sniper-arch-title sniper-arch-desc">
<title id="sniper-arch-title">How Sniper fits together</title>
<desc id="sniper-arch-desc">Three paths reach the same Sniper core. Browser traffic goes through the MITM proxy, which forwards it to the upstream target and hands a copy to the core. An operator reaches the core through the desktop UI, and an AI agent reaches it through sniper-cli and the bundled skills. The core persists everything to the session store on disk.</desc>

