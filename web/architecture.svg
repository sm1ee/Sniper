<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sniper-lanes-title sniper-lanes-desc">
  <title id="sniper-lanes-title">How Sniper fits together</title>
  <desc id="sniper-lanes-desc">Three paths reach the same Sniper core. Browser traffic goes through the MITM proxy, which forwards it to the real server and hands a copy to the core. An operator reaches the core through the desktop app and an AI agent through sniper-cli, both over the same loopback HTTP API. The core writes everything to the session store on disk.</desc>
