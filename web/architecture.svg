<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sniper-sessions-title sniper-sessions-desc">
  <title id="sniper-sessions-title">How Sniper fits together</title>
  <desc id="sniper-sessions-desc">Three paths reach the same Sniper core, and the core keeps several sessions side by side. Browsers and apps go through the MITM proxy, which has a port for each session that captures, forwards the traffic to the real server and hands a copy to the core. An operator reaches the core through the desktop app and AI agents through sniper-cli, over the same loopback HTTP API. Each session has its own port, scope, history and relay, and the core writes each one to the session store on disk.</desc>
