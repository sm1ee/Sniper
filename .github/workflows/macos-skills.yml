name: macOS skill transactions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-skills-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-15-arm64-synthetic-skills
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run native synthetic skill transaction tests
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          qa_root="$(mktemp -d "$RUNNER_TEMP/sniper-skills.XXXXXX")"
          evidence="$RUNNER_TEMP/sniper-macos-skills-evidence"
          mkdir "$evidence"
          printf '%s\n' "$GITHUB_SHA" > "$evidence/source-sha.txt"
          sw_vers > "$evidence/macos-version.txt"
          printf '%s %s\n' "$(uname -s)" "$(uname -m)" > "$evidence/native-platform.txt"
          rustc --version --verbose > "$evidence/rust-toolchain.txt"

          # Preserve the already-installed build toolchain while isolating every
          # host/data/temp root seen by the tests. No GUI or installed-agent work.
          original_home="$HOME"
          export CARGO_HOME="${CARGO_HOME:-$original_home/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
          mkdir "$qa_root/home" "$qa_root/profile" "$qa_root/codex" \
            "$qa_root/claude" "$qa_root/data" "$qa_root/tmp"
          export HOME="$qa_root/home"
          export USERPROFILE="$qa_root/profile"
          export CODEX_HOME="$qa_root/codex"
          export CLAUDE_HOME="$qa_root/claude"
          export SNIPER_DATA_DIR="$qa_root/data"
          export TMPDIR="$qa_root/tmp"

          # Require the Darwin-only ACL fixtures to be compiled and discovered;
          # a typo or cfg exclusion must not produce a misleading zero-test pass.
          cargo test --locked --release --lib skill_activation:: -- --list \
            2>&1 | tee "$evidence/activation-test-list.log"
          for name in \
            absent_and_explicitly_empty_acls_allow_private_fixture_files_and_directories \
            current_owner_allow_and_deny_aces_refuse_before_activation \
            real_parent_inheritance_is_rejected_on_new_child_files_and_directories; do
            grep -F "macos_acl_fixtures::$name: test" "$evidence/activation-test-list.log"
          done
          cargo test --locked --release --lib skill_activation:: \
            2>&1 | tee "$evidence/activation-tests.log"
          cargo check --locked --release --bin sniper-desktop \
            2>&1 | tee "$evidence/desktop-compile.log"
          cargo test --locked --release --lib skill_auto_update:: \
            2>&1 | tee "$evidence/auto-update-tests.log"
          cargo test --locked --release --lib skill_managed:: \
            2>&1 | tee "$evidence/managed-tests.log"
          cargo test --locked --release \
            --test skills_activation_cli --test skills_managed_cli --test skills_auto_update_cli \
            2>&1 | tee "$evidence/cli-tests.log"
      - name: Preserve focused native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniper-macos-skills-arm64-evidence
          path: ${{ runner.temp }}/sniper-macos-skills-evidence/
          if-no-files-found: warn
          retention-days: 14
