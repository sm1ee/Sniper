name: Linux candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian13-x86_64:
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    container:
      image: rust:1.99.0-trixie
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies in disposable Debian container
        run: |
          test "$(. /etc/os-release && printf '%s:%s' "$ID" "$VERSION_ID")" = debian:13
          test "$(uname -m)" = x86_64
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libssl-dev dpkg-dev binutils python3 curl desktop-file-utils
          rustup component add rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian13-x86_64
      - name: Check source and package contracts
        run: |
          cargo fmt --all -- --check
          node --check web/app.js
          node --test tests/*.test.cjs
          python3 -B -m unittest discover -s tests -p 'linux_packaging_test.py' -v
          python3 -B -m unittest discover -s packaging/linux/qualification -p 'test_*.py' -v
          bash -n packaging/linux/qualification/run_fresh_runtime.sh
          desktop-file-validate packaging/linux/sniper.desktop
      - name: Test and build native binaries
        run: |
          cargo test --locked --release
          cargo build --locked --release --bins
      - name: Verify raw HTTP targets against isolated local origins
        run: python3 -B tests/raw_request_target_smoke.py target/release
      - name: Record exact inputs and build candidate artifacts
        id: package
        run: |
          set -euo pipefail
          checkout="$(pwd -P)"
          if [[ "$checkout" != "$GITHUB_WORKSPACE" ]]; then
            echo 'Packaging checkout does not match GITHUB_WORKSPACE' >&2
            exit 1
          fi
          # Trust only this container checkout and this step's Git child processes.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$checkout"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo 'Git returned an invalid source timestamp' >&2
            exit 1
          fi
          mkdir -p dist
          rustc --version --verbose > dist/linux-toolchain.txt
          dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\n' > dist/linux-debian-packages.tsv
          python3 -B packaging/linux/package.py record \
            --binaries-dir target/release --output dist/linux-build-record.json \
            --source-date-epoch "$source_date_epoch" \
            --toolchain-file dist/linux-toolchain.txt \
            --dependency-manifest dist/linux-debian-packages.tsv \
            --build-command 'cargo build --locked --release --bins'
          python3 -B packaging/linux/package.py package \
            --binaries-dir target/release --build-record dist/linux-build-record.json \
            --output-dir dist/linux-candidate
          (cd dist/linux-candidate && sha256sum -c ./*.sha256)
          echo "manifest_sha256=$(sha256sum dist/linux-candidate/build-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload_candidate
        with:
          name: sniper-debian13-x86_64-candidate
          path: dist/linux-candidate/
          if-no-files-found: error

  runtime-debian13-x86_64:
    needs: debian13-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_MANIFEST_SHA256: ${{ needs.debian13-x86_64.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.debian13-x86_64.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sniper-qa-input
      - name: Qualify exact package in an explicit socket-free Debian runtime
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e "$RUNNER_TEMP/sniper-qa-evidence"
          mkdir "$RUNNER_TEMP/sniper-qa-evidence"
          input="$(realpath "$RUNNER_TEMP/sniper-qa-input")"
          scripts="$(realpath "$GITHUB_WORKSPACE/packaging/linux/qualification")"
          evidence="$(realpath "$RUNNER_TEMP/sniper-qa-evidence")"
          test "$input" = "$RUNNER_TEMP/sniper-qa-input"
          test "$scripts" = "$GITHUB_WORKSPACE/packaging/linux/qualification"
          test "$evidence" = "$RUNNER_TEMP/sniper-qa-evidence"
          docker pull --platform linux/amd64 debian:13-slim
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' debian:13-slim)"
          [[ "$image" =~ ^debian@sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Os}}:{{.Architecture}}' "$image")" = linux:amd64
          docker image inspect "$image" > "$evidence/official-image.json"
          printf '%s\n' "$image" > "$evidence/official-image-digest.txt"
          docker run --rm --pull=never --platform linux/amd64 \
            --name "sniper-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --mount "type=bind,src=$input,dst=/qa/input,readonly" \
            --mount "type=bind,src=$scripts,dst=/qa/scripts,readonly" \
            --mount "type=bind,src=$evidence,dst=/qa/results" \
            --env SNIPER_PACKAGE_QA_MODE=explicit-docker-runtime \
            --env RUNNER_ENVIRONMENT=github-hosted \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT --env GITHUB_SHA \
            --env "SNIPER_QA_IMAGE=$image" \
            --env EXPECTED_MANIFEST_SHA256 \
            --entrypoint /bin/bash \
            "$image" /qa/scripts/run_fresh_runtime.sh \
            2>&1 | tee "$evidence/docker-run.log"
      - name: Preserve runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniper-debian13-x86_64-runtime-evidence
          path: |
            ${{ runner.temp }}/sniper-qa-evidence/*.json
            ${{ runner.temp }}/sniper-qa-evidence/*.txt
            ${{ runner.temp }}/sniper-qa-evidence/*.tsv
            ${{ runner.temp }}/sniper-qa-evidence/*.log
            ${{ runner.temp }}/sniper-qa-evidence/evidence/*.json
          if-no-files-found: warn
          retention-days: 14
