name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --release
      - run: python tests/runtime_smoke.py
      - name: Build portable package
        shell: pwsh
        run: ./packaging/windows/make-zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sniper-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
