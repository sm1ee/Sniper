name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --release
      - run: python tests/runtime_smoke.py
      # The release script, not make-zip.ps1 directly: running the real release
      # path on every push is what stops it rotting between releases, which is
      # the only time anyone would otherwise notice it broke.
      - name: Build portable package
        shell: pwsh
        env:
          ALLOW_ADHOC_RELEASE: '1'
        run: ./packaging/windows/release-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sniper-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

  attach-to-release:
    # The Windows archive used to be fetched from a run and attached by hand,
    # which is easy to forget and easy to get wrong. A tag push now attaches it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sniper-windows-x64
          path: dist
      # AGENTS.md has the maintainer create the release with the DMG after
      # pushing the tag, so the release may not exist yet when this job starts.
      - name: Wait for the release to exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          foreach ($attempt in 1..30) {
            gh release view $tag --repo ${{ github.repository }} *> $null
            if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag is present."; exit 0 }
            Write-Host "Release $tag not created yet (attempt $attempt/30); waiting 30s."
            Start-Sleep -Seconds 30
          }
          Write-Error "Release $tag was never created. Attach dist/ from this run by hand."
          exit 1
      - name: Attach the Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -Include *.zip, *.sha256 -Recurse
          if (-not $files) { Write-Error 'No artifacts to attach.'; exit 1 }
          gh release upload '${{ github.ref_name }}' $files.FullName --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
